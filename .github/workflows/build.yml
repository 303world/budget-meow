name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug + release
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Show APK info
        run: |
          ls -l app/build/outputs/apk/debug app/build/outputs/apk/release || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: budget-meow-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: budget-meow-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: apks

      - name: List
        run: ls -l apks

      - name: Extract changelog for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'PYEOF'
import re, sys
version = sys.argv[1]
text = open('CHANGELOG.md', encoding='utf-8').read()
pattern = re.compile(r'^## \[' + re.escape(version) + r'\].*?$(.*?)(?=^## |\Z)', re.M | re.S)
match = pattern.search(text)
body = match.group(1).strip() if match else ''
open('release_notes.md', 'w', encoding='utf-8').write(
    body or f'版本 {version} 的更新日志见 CHANGELOG.md。'
)
print('release notes bytes:', len(body))
PYEOF
          head -20 release_notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          body_path: release_notes.md
          generate_release_notes: false
